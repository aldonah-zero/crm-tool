services:
  # Backend API (Free tier - 750 hours/month, spins down after 15 min idle)
  - type: web
    name: crm-tool-backend-e885b1
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main_api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Required - the backend refuses to start without these (set the
      # values in the Render dashboard; sync: false keeps them out of git).
      - key: INVITE_SECRET
        sync: false
      - key: INTERNAL_CRON_SECRET
        sync: false
      - key: ADMIN_SECRET
        sync: false

  # Frontend (Free static site)
  - type: web
    name: crm-tool-frontend-e885b1
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/build
    envVars:
      - key: VITE_API_URL
        value: https://crm-tool-backend-e885b1.onrender.com
      # Used to come from the committed frontend/.env.production - now set
      # these in the Render dashboard (they are baked in at build time).
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    headers:
      - path: /assets/*.js
        name: Content-Type
        value: application/javascript
      - path: /assets/*.css
        name: Content-Type
        value: text/css
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
