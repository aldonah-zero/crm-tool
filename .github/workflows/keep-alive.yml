name: Keep backend and database awake

on:
  schedule:
    # Render's free tier spins the backend down after 15 min idle, and a
    # separately-hosted database (e.g. a free-tier Supabase project) can
    # pause after a period of inactivity too. Pinging well under that
    # 15-minute window keeps both warm.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            "https://crm-tool-backend-e885b1.onrender.com/health")
          echo "Response body:"
          cat /tmp/response.json
          echo ""
          if [ "$status" -ge 300 ]; then
            echo "Health endpoint returned HTTP $status"
            exit 1
          fi
