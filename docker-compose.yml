version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/Class_Diagram.db
      # Required - the backend refuses to start without them.
      - INVITE_SECRET=${INVITE_SECRET:?set INVITE_SECRET}
      - INTERNAL_CRON_SECRET=${INTERNAL_CRON_SECRET:?set INTERNAL_CRON_SECRET}
      - ADMIN_SECRET=${ADMIN_SECRET:?set ADMIN_SECRET}
    volumes:
      - sqlite_data:/app/data


volumes:
  sqlite_data:
